board = esp32dev
framework = arduino
board_microros_distro = humble
board_microros_transport = wifi
lib_deps =
    https://github.com/jonnieZG/EWMA
    adafruit/Adafruit BNO08x@^1.2.5
    mikalhart/TinyGPSPlus@^1.0.2
    olikraus/U8g2@^2.35.9

build_flags = -I ../../include